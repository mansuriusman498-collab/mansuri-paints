name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Generate Launcher Icons
        run: node scripts/generate-icons.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Fix Capacitor Android Configurations
        run: |
          find node_modules/@capacitor android -name "*.gradle" -exec sed -i 's/8.13.0/8.2.1/g' {} + 2>/dev/null || true

      - name: Ensure Gradle Wrapper
        run: |
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! jar tf gradle/wrapper/gradle-wrapper.jar org/gradle/wrapper/GradleWrapperMain.class > /dev/null 2>&1; then
            echo "Gradle wrapper JAR missing or invalid. Downloading Gradle wrapper 8.2.1..."
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
          validate-wrappers: false

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MansuriPaints-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
